version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: honey-postgres
    environment:
      POSTGRES_USER: honey_admin
      POSTGRES_PASSWORD: honey_password
      POSTGRES_DB: honey_quality
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: honey-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: honey_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: honey_password123
      DOCKER_INFLUXDB_INIT_ORG: honey_org
      DOCKER_INFLUXDB_INIT_BUCKET: sensor_data
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

volumes:
  postgres_data:
  influxdb_data:
